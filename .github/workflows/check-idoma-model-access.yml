name: Check Idoma model access

on:
  workflow_dispatch:

jobs:
  check-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Check gated Idoma ASR access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not configured. Add it as a GitHub Actions repository secret after model approval."
            exit 1
          fi
          python ml/idoma-asr/scripts/check_external_model_access.py
