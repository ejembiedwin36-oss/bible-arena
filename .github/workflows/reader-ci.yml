name: Reader verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This repository does not currently commit a package-lock.json.
      # npm ci and setup-node's npm cache both require a lockfile.
      - run: npm install
      - run: npm test
      - run: npm run typecheck:api
      - run: npx tsc --noEmit
      - run: npm run build
