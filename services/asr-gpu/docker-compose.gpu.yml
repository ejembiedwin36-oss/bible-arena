services:
  asr-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ASR_MODEL_ID: ${ASR_MODEL_ID:-omniASR_LLM_300M_v2}
      ASR_DEVICE: ${ASR_DEVICE:-cuda}
      ASR_LANGUAGE_CODE: ${ASR_LANGUAGE_CODE:-idu_Latn}
      ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-10485760}
    gpus: all
    restart: unless-stopped
